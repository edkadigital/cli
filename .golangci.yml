version: "2"

linters:
  settings:
    errcheck:
      # Progress, tables and test responses are printed without a check. Code
      # that must know a write failed uses the writer's own methods.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # An error may start with the name Edka.
        - -ST1005
        # Suggested rewrites, not defects.
        - -QF*
  exclusions:
    rules:
      # A test may drop the error of a cleanup or of a fake server's response.
      - path: _test\.go
        linters:
          - errcheck
        text: \.(Close|Write|Encode|Serve|Kill|Wait)` is not checked

issues:
  # Report every finding, not the first 50 of a linter or 3 of a kind.
  max-issues-per-linter: 0
  max-same-issues: 0
