<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · Edka CLI</title>
<style>
:root{--bg:#fafafa;--fg:#1a1a1a;--muted:rgba(26,26,26,.62);--faint:rgba(26,26,26,.3);--hair:rgba(26,26,26,.1);--grid:rgba(26,26,26,.05);--red:#ee3124;--caret:#00a880;--flash:#1a1a1a}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--fg:#fcfbf7;--muted:rgba(252,251,247,.6);--faint:rgba(252,251,247,.3);--hair:rgba(252,251,247,.1);--grid:rgba(252,251,247,.045);--caret:#3fd1a6;--flash:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Mono",ui-monospace,Menlo,Monaco,Consolas,monospace;display:grid;place-items:center}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-position:center;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.corner{position:fixed;width:24px;height:24px}
.corner::before,.corner::after{content:"";position:absolute;background:var(--faint)}
.corner::before{left:0;right:0;height:1px}
.corner::after{top:0;bottom:0;width:1px}
.corner i{position:absolute;left:10px;top:10px;width:4px;height:4px;background:var(--red)}
.tl{top:16px;left:16px}.tl::before{top:0}.tl::after{left:0}
.tr{top:16px;right:16px}.tr::before{top:0}.tr::after{right:0}
.bl{bottom:16px;left:16px}.bl::before{bottom:0}.bl::after{left:0}
.br{bottom:16px;right:16px}.br::before{bottom:0}.br::after{right:0}
main{position:relative;width:100%;max-width:520px;padding:48px 16px}
.mark{display:block;width:100%;max-width:476px;height:70px}
.d{animation:show 1ms var(--t) both,hop calc(var(--h)*55ms) var(--t) steps(var(--h),end) both,land 80ms calc(var(--t) + var(--h)*55ms) steps(1,end)}
.p{opacity:0;animation:stream 380ms var(--t) steps(6,end) both}
.c0{fill:#ee3124}.c1{fill:#f7921e}.c2{fill:#fcb53b}.c3{fill:#00a880}.c4{fill:#0090a1}
.sheen{animation:sheen 650ms 950ms cubic-bezier(.4,0,.2,1) both}
.off .mark{filter:grayscale(1);opacity:.4}
.off .d{animation:none}
.tag{display:flex;align-items:center;gap:12px;margin:36px 0 0;font-size:11px;letter-spacing:.2em;color:var(--muted);animation:rise 400ms 250ms cubic-bezier(.2,.8,.2,1) both}
.tag i{width:8px;height:8px;background:var(--red);flex:none}
.tag b{flex:1;height:1px;background:var(--hair)}
h1{margin:14px 0 0;font-size:clamp(20px,6vw,28px);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.type span{position:relative;animation:show 1ms calc(450ms + var(--i)*30ms) both}
.type span::after{content:"";position:absolute;left:100%;top:.14em;bottom:.06em;width:.58em;margin-left:.06em;background:var(--caret);opacity:0;animation:caret 30ms calc(450ms + var(--i)*30ms) steps(1,end)}
.type span:last-child::after{animation:blink 1.1s calc(450ms + var(--i)*30ms) steps(1,end) infinite}
.off .type span::after{background:var(--fg)}
p.detail{margin:16px 0 0;max-width:46ch;font-size:14px;line-height:1.7;color:var(--muted);animation:rise 450ms calc(500ms + var(--n)*30ms) cubic-bezier(.2,.8,.2,1) both}
p.cmd{display:inline-block;padding:8px 14px;border:1px solid var(--hair);color:var(--fg);font-size:13px}
p.cmd span{color:var(--faint);user-select:none}
.sr{user-select:none;position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes hop{from{transform:translateX(calc(var(--h)*2px))}to{transform:none}}
@keyframes stream{0%{opacity:0;transform:none}15%{opacity:1}70%{opacity:.55}100%{opacity:0;transform:translateX(-3px)}}
@keyframes sheen{from{transform:translateX(-6px)}to{transform:translateX(14px)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes land{from,to{fill:var(--flash)}}
@keyframes caret{from,to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important}.type span:last-child::after{opacity:1}}
</style>
<body class="{{if not .Received}}off{{end}}">
<span class="corner tl"><i></i></span><span class="corner tr"><i></i></span><span class="corner bl"><i></i></span><span class="corner br"><i></i></span>
<main>
<svg class="mark" viewBox="0 0 68 10" preserveAspectRatio="xMinYMid slice" aria-hidden="true">
<defs>
<linearGradient id="r1"><stop offset="0" stop-color="#ee3124"/><stop offset="1" stop-color="#b5231d"/></linearGradient>
<linearGradient id="r2"><stop offset="0" stop-color="#ee3124"/><stop offset="1" stop-color="#ea5329"/></linearGradient>
<linearGradient id="r3"><stop offset="0" stop-color="#ea5329"/><stop offset="1" stop-color="#f7921e"/></linearGradient>
<linearGradient id="o1"><stop offset="0" stop-color="#f7921e"/><stop offset="1" stop-color="#fcb53b"/></linearGradient>
<linearGradient id="y1"><stop offset="0" stop-color="#fcb53b"/><stop offset="1" stop-color="#ffd58e"/></linearGradient>
<linearGradient id="g1"><stop offset="0" stop-color="#00a880"/><stop offset="1" stop-color="#93d0ac"/></linearGradient>
<linearGradient id="b1"><stop offset="0" stop-color="#0090a1"/><stop offset="1" stop-color="#7ad0e2"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="shape"><path d="M1 2l1 1-1 1-1-1zM1 6l1 1-1 1-1-1zM2 1l1 1-1 1-1-1zM2 3l1 1-1 1-1-1zM2 5l1 1-1 1-1-1zM2 7l1 1-1 1-1-1zM3 0l1 1-1 1-1-1zM3 8l1 1-1 1-1-1zM4 1l1 1-1 1-1-1zM4 7l1 1-1 1-1-1zM6 3l1 1-1 1-1-1zM6 5l1 1-1 1-1-1zM7 4l1 1-1 1-1-1z"/></clipPath>
<path id="px" d="M0-.5.5 0 0 .5-.5 0z"/>
</defs>
{{if .Received}}<g>{{range .Pixels}}<use href="#px" x="{{.X}}" y="{{.Y}}" class="p c{{.Color}}" style="--t:{{.Delay}}ms"/>{{end}}</g>{{end}}
<g>
<path class="d" fill="url(#r2)" d="M1 2l1 1-1 1-1-1z" style="--t:320ms;--h:4"/>
<path class="d" fill="url(#r2)" d="M1 6l1 1-1 1-1-1z" style="--t:360ms;--h:4"/>
<path class="d" fill="url(#r3)" d="M2 1l1 1-1 1-1-1z" style="--t:390ms;--h:3"/>
<path class="d" fill="url(#r1)" d="M2 3l1 1-1 1-1-1z" style="--t:420ms;--h:4"/>
<path class="d" fill="url(#r1)" d="M2 5l1 1-1 1-1-1z" style="--t:450ms;--h:4"/>
<path class="d" fill="url(#r3)" d="M2 7l1 1-1 1-1-1z" style="--t:480ms;--h:3"/>
<path class="d" fill="url(#o1)" d="M3 0l1 1-1 1-1-1z" style="--t:510ms;--h:3"/>
<path class="d" fill="url(#o1)" d="M3 8l1 1-1 1-1-1z" style="--t:540ms;--h:3"/>
<path class="d" fill="url(#y1)" d="M4 1l1 1-1 1-1-1z" style="--t:580ms;--h:2"/>
<path class="d" fill="url(#y1)" d="M4 7l1 1-1 1-1-1z" style="--t:610ms;--h:2"/>
<path class="d" fill="url(#g1)" d="M6 3l1 1-1 1-1-1z" style="--t:660ms;--h:2"/>
<path class="d" fill="url(#g1)" d="M6 5l1 1-1 1-1-1z" style="--t:690ms;--h:2"/>
<path class="d" fill="url(#b1)" d="M7 4l1 1-1 1-1-1z" style="--t:740ms;--h:2"/>
</g>
{{if .Received}}<g clip-path="url(#shape)"><rect class="sheen" x="-3" y="0" width="3" height="10" fill="url(#shine)"/></g>{{end}}
</svg>
<p class="tag"><i></i>EDKA / CLI<b></b></p>
<h1><span class="sr">{{.Title}}</span><span class="type" aria-hidden="true">{{range $i, $c := .Chars}}<span style="--i:{{$i}}">{{$c}}</span>{{end}}</span></h1>
<p class="detail" style="--n:{{len .Chars}}">{{.Detail}}</p>
{{if .Retry}}<p class="detail cmd" style="--n:{{len .Chars}}"><span>$</span> edka login</p>{{end}}
</main>
</body>
</html>
